[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-pricing"
version = "1.0.0"
description = "Dynamic pricing models for urban parking lots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
streaming = ["pathway>=0.8", "bokeh>=3.2", "panel>=1.3"]
dev = ["pytest>=7.4"]

[project.scripts]
parking-pricing = "parking_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
